[package]
name = "pegoles-computer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pegoles Computer abstraction: backend trait + Mock backend + macOS stub"
license = "MIT"

[dependencies]
pegoles-protocol = { workspace = true }
pegoles-guest-proto = { path = "../pegoles-guest-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
ureq = { workspace = true }
# Pure-Rust gzip (miniz_oxide) for the pinned guest image archive.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
libc = { workspace = true }

# Windows-only: official bindings for host capability detection
# (registry, services, security). Never built on other platforms.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
