[package]
name = "pegoles-egress"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pegoles egress: host-side proxy for the agent computer (mux, immutable policy, TLS interception, response inspection, audit); docs/EGRESS.md"
license = "MIT"

[dependencies]
pegoles-egress-proto = { path = "../pegoles-egress-proto" }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
time = { version = "0.3", default-features = false, features = ["std"] }
httparse = "1"
idna = "1"
psl = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
