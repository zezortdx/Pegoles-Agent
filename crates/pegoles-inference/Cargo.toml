[package]
name = "pegoles-inference"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pegoles local inference: hardware profile, verified model store, replaceable inference backends (MLX and llama.cpp workers)"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ring = "0.17"
hex = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = "3"
