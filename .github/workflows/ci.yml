name: ci

# Pull requests and pushes to main. Nothing here boots a VM, downloads a
# guest image or model, signs, or touches a secret: every job runs with a
# read-only token on GitHub-hosted runners (never self-hosted).
#
# The reference platform is macOS on Apple silicon, so the full gate
# (Rust incl. the Tauri shell, Swift helper, frontend) runs on macos-15
# (arm64). The Linux/Windows jobs cover only crates that are proven to
# build there (see the portability job).
#
# Caches are deliberately not used anywhere: a cache written by one run
# can be restored by another ref, and the release workflow must never
# consume anything a CI run produced.
#
# Actions are pinned to full commit SHAs (version in the comment);
# Dependabot proposes updates (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain the gate is known green with (clippy lints change
  # between releases). Bump deliberately, together with release.yml.
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.21.0"
  # pnpm's version comes from "packageManager" in package.json.
  # Xcode (macOS SDK, Swift) on the macos-15 image; same as release.yml.
  # Ignored on Linux and Windows.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # pegoles-desktop builds with Tauri's custom-protocol feature, which
      # embeds apps/desktop/dist at compile time: build the frontend first.
      # Dependency lifecycle scripts are not run (only esbuild has one, and
      # esbuild locates its platform binary without it).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @pegoles/desktop build
      - run: xcodebuild -version && rustc --version && node --version && pnpm --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  rust-release:
    # Release-only code (cfg(not(debug_assertions)): the shipped IPC
    # command set, image selection, policy/inference release paths) is
    # compiled and tested here with the release profile.
    name: Rust release profile (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @pegoles/desktop build
      # pegoles-computer's tests assert the release behaviour of the
      # debug-only overrides (image id, builder mode) and pin enforcement.
      - run: cargo test --release --locked -p pegoles-policy -p pegoles-inference -p pegoles-computer
      # The shipped desktop code (release IPC command set) must compile.
      # Its tests call debug-only helpers (ScriptCancel::arm/disarm), so
      # they run in the debug job only.
      - run: cargo build --release --locked -p pegoles-desktop

  swift:
    name: Swift VM helper (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift build -c release --package-path native/macos/pegoles-vm-host

  web:
    name: Frontend (lint, typecheck, test, build)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @pegoles/desktop lint
      - run: pnpm --filter @pegoles/desktop typecheck
      - run: pnpm --filter @pegoles/desktop test
      - run: pnpm --filter @pegoles/ui typecheck
      - run: pnpm --filter @pegoles/ui test
      - run: pnpm --filter @pegoles/desktop build

  guest-cross:
    # The guest runtime (and the dev input fixture) must compile for
    # aarch64 Linux. `cargo check` needs no linker, so this runs on macOS.
    name: Guest runtime (aarch64 and x86_64 Linux check)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu
      - run: cargo check --locked -p pegoles-guest-runtime --all-targets --target aarch64-unknown-linux-gnu
      - run: cargo check --locked --manifest-path guest/fixture/Cargo.toml --target aarch64-unknown-linux-gnu
      # The x64 image (Windows hosts) runs the same runtime on x86_64.
      - run: cargo check --locked -p pegoles-guest-runtime --all-targets --target x86_64-unknown-linux-gnu
      - run: cargo check --locked --manifest-path guest/fixture/Cargo.toml --target x86_64-unknown-linux-gnu

  portability:
    # The shared crates on Linux (no Linux host backend exists; this keeps
    # them portable). Windows has its own jobs below.
    name: Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            crates: >-
              -p pegoles-protocol -p pegoles-policy -p pegoles-guest-proto
              -p pegoles-core -p pegoles-computer -p pegoles-agent -p pegoles-inference
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --locked ${{ matrix.crates }} --all-targets -- -D warnings
      - run: cargo test --locked ${{ matrix.crates }}
      # The guest runtime is Linux code: run its unit tests natively. (Its
      # Linux-only paths are not clippy-clean yet, so no clippy here.)
      - if: runner.os == 'Linux'
        run: cargo test --locked -p pegoles-guest-runtime

  windows:
    # Every Rust crate the Windows app ships (the shared crates, the
    # PegolesVmBroker service, the unprivileged VM helper, the desktop
    # shell), linted and tested on Windows x64, and the proof that the
    # main webview cannot reach the network under WebView2 (the probe must
    # see traffic without containment and none with it). The runner is
    # Windows Server 2025, not the consumer Windows 11 the product
    # targets; nothing here boots a guest.
    name: Windows x64 (Rust, desktop shell, webview egress)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      WINDOWS_CRATES: >-
        -p pegoles-protocol -p pegoles-policy -p pegoles-guest-proto -p pegoles-core
        -p pegoles-computer -p pegoles-agent -p pegoles-inference
        -p pegoles-broker-proto -p pegoles-broker -p pegoles-vm-host-windows -p pegoles-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @pegoles/desktop build
      - run: cargo clippy --locked ${{ env.WINDOWS_CRATES }} --all-targets -- -D warnings
      - run: cargo test --locked ${{ env.WINDOWS_CRATES }}
      - name: What onboarding's system check sees on this runner
        run: |
          cargo run --locked -p pegoles-computer --example windows_readiness
          cargo run --locked -p pegoles-inference --example models -- hw
      - name: Webview egress probe (WebView2)
        run: |
          cargo run --locked -p pegoles-desktop --example webview_egress_probe -- control
          cargo run --locked -p pegoles-desktop --example webview_egress_probe -- contained

  windows-installer:
    # Pegoles Local's llama.cpp worker (CPU + Vulkan backends) built and
    # tested on Windows; the NSIS installer built from scratch
    # (scripts/package-windows.sh), installed silently per machine, checked
    # (files, the broker service and its security descriptor, a real HCS
    # VM started and destroyed through the helper and the broker, the
    # worker starting inside its AppContainer + job object from the
    # install folder), then uninstalled and checked again. Unsigned; nothing is
    # published. The installer is kept as a short-lived run artifact for
    # manual testing only (the release workflow never uses CI output).
    name: Windows installer (llama.cpp worker, NSIS, install/uninstall)
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VULKAN_SDK_VERSION: "1.4.357.0"
      # LunarG's published SHA-256, checked independently.
      VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vulkan SDK (pinned by SHA-256; headers, loader library, glslc)
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            -o "$RUNNER_TEMP/vulkansdk.exe" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/vulkansdk-windows-X64-${VULKAN_SDK_VERSION}.exe"
          echo "$VULKAN_SDK_SHA256  $RUNNER_TEMP/vulkansdk.exe" | sha256sum --strict -c -
          "$RUNNER_TEMP/vulkansdk.exe" --root 'C:\VulkanSDK' --accept-licenses --default-answer --confirm-command install
          printf '%s\n' 'VULKAN_SDK=C:\VulkanSDK' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          printf '%s\n' 'C:\VulkanSDK\Bin' >> "$GITHUB_PATH"
      # llama.cpp's Vulkan shader generator is a nested CMake project that
      # the Visual Studio generator fails to install; build with Ninja (as
      # llama.cpp's own Windows CI does), which needs the MSVC developer
      # environment.
      - name: MSVC developer environment and the Ninja generator
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            # Not VCINSTALLDIR & co: with those set, rustc takes link.exe
            # from PATH, where Git's GNU link comes first in bash steps.
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH|WindowsSdkDir|WindowsSdkBinPath|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # A short target directory: llama.cpp's nested Vulkan shader build
      # overflows the 260-character path limit under the checkout.
      - run: cargo clippy --locked --manifest-path workers/llama/Cargo.toml --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: C:\pl
      - run: cargo test --locked --manifest-path workers/llama/Cargo.toml
        env:
          CARGO_TARGET_DIR: C:\pl
      - run: bash scripts/package-windows.sh
        env:
          PEGOLES_LLAMA_TARGET_DIR: /c/pl
      - name: Install silently (per machine)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release-artifacts\Pegoles-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
      - name: Installed files and the broker service
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'Pegoles Agent'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'pegoles-vm-host.exe', 'pegoles-broker.exe', 'pegoles-llm-worker.exe', 'llama.dll', 'ggml.dll', 'ggml-base.dll', 'mtmd.dll', 'ggml-vulkan.dll', 'vcruntime140.dll', 'msvcp140.dll', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          if (-not (Get-ChildItem $dir -Filter 'ggml-cpu-*.dll')) { throw 'no CPU backends' }
          & (Join-Path $dir 'pegoles-broker.exe') --version
          '{"id":1,"command":"version"}' | & (Join-Path $dir 'pegoles-vm-host.exe')
          sc.exe qc PegolesVmBroker
          if ($LASTEXITCODE -ne 0) { throw 'PegolesVmBroker is not registered' }
          $sd = (sc.exe sdshow PegolesVmBroker | Out-String).Trim()
          Write-Output "service SDDL: $sd"
          if ($sd -notmatch '\(A;;CCLCSWRPLOCRRC;;;IU\)') { throw 'interactive users should only query/start the service' }
          sc.exe start PegolesVmBroker
          Start-Sleep -Seconds 3
          if (-not ([System.IO.Directory]::GetFiles('\\.\pipe\') -match 'pegoles-vm-broker')) { throw 'broker pipe missing' }
          sc.exe stop PegolesVmBroker
      - name: A real HCS VM through the helper and the broker (empty disk, firmware only)
        shell: pwsh
        run: .github/scripts/windows-hcs-smoke.ps1
      - name: The installed worker starts confined (AppContainer + job object)
        shell: pwsh
        run: |
          $env:PEGOLES_LLM_WORKER = Join-Path $env:ProgramFiles 'Pegoles Agent\pegoles-llm-worker.exe'
          cargo test --release --locked -p pegoles-inference the_real_worker -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'confined worker test failed' }
      # Pegoles Local on Windows for real: the pinned GGUF model installed
      # by the product's store code (download, SHA-256 of every file,
      # atomic install), then generations by the installed worker inside
      # its sandbox, on a guest screenshot. The runner has no GPU, so
      # llama.cpp runs on the CPU (the backend it picks is printed).
      - name: Pegoles Local on Windows (model install, confined generation)
        shell: pwsh
        run: |
          cargo run --release --locked -p pegoles-inference --example models -- hw
          cargo run --release --locked -p pegoles-inference --example models -- install mai-ui-2b-q8-gguf
          if ($LASTEXITCODE -ne 0) { throw 'model install failed' }
          cargo run --release --locked -p pegoles-inference --example gguf_probe -- (Join-Path $env:ProgramFiles 'Pegoles Agent\pegoles-llm-worker.exe')
          if ($LASTEXITCODE -ne 0) { throw 'generation failed' }
      - name: Uninstall silently and check nothing is left
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'Pegoles Agent'
          $p = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          sc.exe query PegolesVmBroker
          if ($LASTEXITCODE -ne 1060) { throw 'PegolesVmBroker is still registered' }
          $left = Get-ChildItem $dir -ErrorAction SilentlyContinue | Where-Object Name -ne 'uninstall.exe'
          if ($left) { $left | Format-Table Name; throw 'files left behind' }
          # 1060 above was the expected answer; do not end the step with it.
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pegoles-Setup-x64-unsigned
          path: |
            target/release-artifacts/Pegoles-Setup-x64.exe
            target/release-artifacts/Pegoles-Setup-x64.exe.sha256
          retention-days: 7
          if-no-files-found: error

  guest-image-x64:
    # The x64 guest image for Windows, built from scratch the way it is
    # published (scripts/build-guest-image/build-x64.sh): the pinned Debian
    # source, the x86_64 guest runtime, the pinned .deb bundle, one
    # provisioning boot under QEMU/KVM with no network, patch, sanitize,
    # VHDX. Kept as a one-day artifact for the Windows boot job below.
    name: Guest image x64 (build and provision)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools (QEMU, OVMF, xorriso, e2fsprogs) and KVM access
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso e2fsprogs xz-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash scripts/build-guest-image/build-x64.sh "$RUNNER_TEMP/x64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pegoles-guest-x64
          path: |
            ${{ runner.temp }}/x64/disk.vhdx
            ${{ runner.temp }}/x64/manifest.json
            ${{ runner.temp }}/x64/packages.txt
            ${{ runner.temp }}/x64/provision-console.log
          retention-days: 1
          if-no-files-found: error

  windows-guest-boot:
    # The x64 image from guest-image-x64 booted through HCS on a fresh
    # Windows runner, by the real broker and helper (release builds,
    # installed in Program Files with the broker registered as the
    # installer does): first a firmware-only VM from an empty disk, then
    # the real guest, whose runtime the helper must reach over AF_HYPERV.
    # Windows Server on Azure with nested virtualization, as an
    # administrator: not a consumer PC.
    name: Windows guest boot (HCS, AF_HYPERV)
    needs: [guest-image-x64]
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pegoles-guest-x64
          path: ${{ runner.temp }}/guest
      - run: cargo build --release --locked -p pegoles-broker -p pegoles-vm-host-windows
      - name: Place the broker and the helper as the installer does, register the service
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'Pegoles Agent'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\pegoles-broker.exe, target\release\pegoles-vm-host.exe $dir
          & (Join-Path $dir 'pegoles-broker.exe') install-service
          if ($LASTEXITCODE -ne 0) { throw 'install-service failed' }
          Get-Content "$env:RUNNER_TEMP\guest\manifest.json"
      - name: Firmware-only VM (empty disk)
        shell: pwsh
        run: .github/scripts/windows-hcs-smoke.ps1
      - name: The x64 guest boots and its runtime answers over AF_HYPERV
        shell: pwsh
        run: .github/scripts/windows-hcs-smoke.ps1 -Disk "$env:RUNNER_TEMP\guest\disk.vhdx"
      # The product path end to end: Core's executor and Pegoles Policy
      # drive the guest through the helper and the broker (boot, guest
      # handshake, screenshots, click, typing, keys, cancel, a forged
      # action denied, the guest runtime killed and recovered, a second
      # boot). A debug build: it boots the locally sealed image.
      - name: Seal the x64 image as the Windows product image
        run: cargo run --locked -p pegoles-computer --example seal_x64_image -- "$RUNNER_TEMP/guest/disk.vhdx" "$RUNNER_TEMP/guest/manifest.json"
      - name: Agent E2E on Windows (Core, policy, helper, broker, HCS, guest)
        shell: pwsh
        env:
          PEGOLES_VM_HOST_WINDOWS: C:\Program Files\Pegoles Agent\pegoles-vm-host.exe
          PEGOLES_E2E_OUT: ${{ runner.temp }}\e2e
        run: |
          New-Item -ItemType Directory -Force $env:PEGOLES_E2E_OUT | Out-Null
          cargo run --locked -p pegoles-agent --example agent_e2e
          if ($LASTEXITCODE -ne 0) { throw 'agent E2E failed' }
      - name: The computer's files and COM1 log (on failure)
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Pegoles'
          Get-ChildItem -Recurse $root -ErrorAction SilentlyContinue | Format-Table FullName, Length -AutoSize | Out-String -Width 300
          Get-ChildItem -Recurse $root -Filter serial.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "--- $($_.FullName) ($($_.Length) bytes) ---"
            Get-Content $_.FullName -Tail 60
          }
          if (Get-Command hcsdiag -ErrorAction SilentlyContinue) { hcsdiag list }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-agent-e2e-frames
          path: ${{ runner.temp }}/e2e
          retention-days: 3
          if-no-files-found: ignore
      - name: Unregister the service
        if: always()
        shell: pwsh
        run: '& (Join-Path $env:ProgramFiles "Pegoles Agent\pegoles-broker.exe") uninstall-service'

  supply-chain:
    name: Supply chain (cargo-deny, cargo-audit, pnpm audit, lockfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-deny and cargo-audit (pinned, from their own lockfiles)
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      # Advisories (vulnerabilities fail), licenses (deny.toml allow-list),
      # bans, and sources (crates.io only: no git or other registries).
      - run: cargo deny --locked check
      # The llama.cpp worker is its own workspace (own lockfile), same policy.
      - run: cargo deny --locked --manifest-path workers/llama/Cargo.toml --config deny.toml check
      # RustSec: vulnerabilities fail; unmaintained/unsound are printed.
      - run: cargo audit
      - run: cargo audit --file workers/llama/Cargo.lock
      - name: npm lockfile resolves only to registry tarballs with integrity
        run: |
          bad="$(grep -nE '^\s+resolution:' pnpm-lock.yaml \
            | grep -vE 'resolution: \{integrity: sha512-[A-Za-z0-9+/=]+\}$' || true)"
          if [ -n "$bad" ]; then
            echo "::error file=pnpm-lock.yaml::non-registry or integrity-less resolution"
            echo "$bad"
            exit 1
          fi
      - name: Python runtime lock pins every file by hash
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("workers/mlx/requirements.lock").read().replace("\\\n", " ")
          reqs = [l for l in text.splitlines() if l.strip() and not l.lstrip().startswith("#")]
          bad = [l.split()[0] for l in reqs if not re.match(r"^[A-Za-z0-9_.-]+==\S+\s", l) or "--hash=sha256:" not in l]
          if bad:
              print("::error file=workers/mlx/requirements.lock::unpinned or unhashed:", ", ".join(bad))
              sys.exit(1)
          print(f"{len(reqs)} requirements, all pinned with hashes")
          PY
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm audit --prod

  hygiene:
    # Workflow and build-script rules (SHA pins, permissions, timeouts,
    # no caches, --locked/--frozen-lockfile, no privileged or unpinned
    # containers, no fixed /tmp paths), actionlint, and shellcheck.
    name: Workflow and script hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/ci-hygiene.py
      - name: actionlint (pinned by SHA-256)
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck (errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -S error

  secrets:
    # Every commit reachable from this ref, not only the diff: GitHub's own
    # secret scanning is not available while the repository is private.
    # Reviewed false positives are listed one by one in .gitleaksignore.
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (pinned by SHA-256)
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
