name: codeql

# Code scanning ("advanced setup") for every language in the repository:
# Rust (crates, Tauri shell, guest runtime), TypeScript (apps/desktop,
# packages/ui), Python (workers/mlx, scripts), Swift (the VM helper, which
# CodeQL can only analyze from a traced build on macOS) and the workflows
# themselves. Do not also enable "default setup" in the repository
# settings: the two cannot run side by side.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
          - language: python
            build-mode: none
            runner: ubuntu-24.04
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-15
    env:
      # Used by the Swift build only (same Xcode as ci.yml / release.yml).
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'manual'
        run: swift build -c release --package-path native/macos/pegoles-vm-host
      # A private repository without GitHub Code Security cannot store code
      # scanning results: there, the results stay in the run (artifact) and
      # .github/scripts/codeql-gate.py fails the job the way the code
      # scanning check would. Public repositories upload as usual.
      - name: Repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.visibility.outputs.private == 'false' && 'always' || 'never' }}
          output: ${{ runner.temp }}/codeql-sarif
      - if: steps.visibility.outputs.private != 'false'
        run: python3 .github/scripts/codeql-gate.py "$RUNNER_TEMP/codeql-sarif"
      - if: always() && steps.visibility.outputs.private != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          retention-days: 30
          if-no-files-found: ignore
