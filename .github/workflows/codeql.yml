name: codeql

# Code scanning ("advanced setup") for every language in the repository:
# Rust (crates, Tauri shell, guest runtime), TypeScript (apps/desktop,
# packages/ui), Python (workers/mlx, scripts), Swift (the VM helper, which
# CodeQL can only analyze from a traced build on macOS) and the workflows
# themselves. Do not also enable "default setup" in the repository
# settings: the two cannot run side by side.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
          - language: python
            build-mode: none
            runner: ubuntu-24.04
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-15
    env:
      # Used by the Swift build only (same Xcode as ci.yml / release.yml).
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'manual'
        run: swift build -c release --package-path native/macos/pegoles-vm-host
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
