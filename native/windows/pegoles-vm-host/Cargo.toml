[package]
name = "pegoles-vm-host-windows"
version = "0.2.0"
edition = "2021"
publish = false
description = "Pegoles Windows VM host helper (unprivileged): the macOS helper's JSONL command set over the broker service, with the guest channel over Hyper-V sockets"
license = "MIT"

[[bin]]
name = "pegoles-vm-host"
path = "src/main.rs"

[dependencies]
pegoles-computer = { path = "../../../crates/pegoles-computer" }
pegoles-guest-proto = { path = "../../../crates/pegoles-guest-proto" }
pegoles-broker-proto = { path = "../pegoles-broker-proto" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Hypervisor",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Services",
  "Win32_System_Threading",
] }
