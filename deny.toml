# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny --locked check    (CI: .github/workflows/ci.yml, supply-chain)
#
# Every ignore/exception below names its reason. Adding one is a reviewed
# change like any other code change; "allow everything" is never an option.

[graph]
# Every platform the workspace builds for (host app, guest runtime,
# Windows skeleton). Dependencies of other targets are not checked.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Vulnerability advisories always fail the check (not configurable).
# Unmaintained notices fail for crates the workspace depends on directly;
# transitive ones (today: proc-macro-error via gtk3-macros, unic-* via
# tauri-utils/urlpattern) are printed as warnings by `cargo audit` in the
# same CI job and are resolved when the direct dependency moves.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 (unsound VariantStrIter) is pulled only by Tauri's Linux GTK/WebKitGTK backend; Pegoles ships on macOS only, never calls VariantStrIter, and tauri 2.x pins gtk-rs 0.18. Drop when tauri moves to glib >= 0.20." },
]

[licenses]
# Exactly the licenses present in Cargo.lock today (cargo deny list
# --layout license). A new license is a reviewed change to this list.
# LGPL-2.1-or-later (r-efi) is not allowed: r-efi is triple-licensed and
# the MIT/Apache-2.0 alternatives satisfy the policy.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
exceptions = []

# pegoles-desktop has no `license` field in its Cargo.toml; the workspace is
# MIT (LICENSE at the repository root). Remove this entry once the crate
# declares `license = "MIT"`.
[[licenses.clarify]]
crate = "pegoles-desktop"
expression = "MIT"
license-files = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
# Registry wildcards ("*") are refused. Every workspace crate sets
# `publish = false`, so allow-wildcard-paths exempts only the unversioned
# path dependencies between them.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
