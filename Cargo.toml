[workspace]
members = [
  "crates/pegoles-protocol",
  "crates/pegoles-computer",
  "crates/pegoles-policy",
  "crates/pegoles-core",
  "crates/pegoles-guest-proto",
  "crates/pegoles-agent",
  "crates/pegoles-inference",
  "guest/runtime",
  "native/windows/pegoles-vm-host",
  "native/windows/pegoles-broker-proto",
  "native/windows/pegoles-broker",
  "native/macos/pegoles-macos-embed",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
pegoles-protocol = { path = "crates/pegoles-protocol" }
pegoles-computer = { path = "crates/pegoles-computer" }
pegoles-policy = { path = "crates/pegoles-policy" }
pegoles-core = { path = "crates/pegoles-core" }
pegoles-agent = { path = "crates/pegoles-agent" }
pegoles-inference = { path = "crates/pegoles-inference" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["sync", "rt"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
png = "0.18"
ureq = { version = "3", features = ["rustls"] }
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
