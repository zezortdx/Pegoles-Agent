[package]
name = "pegoles-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "pegoles_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
pegoles-protocol = { workspace = true }
pegoles-guest-proto = { path = "../../../crates/pegoles-guest-proto" }
pegoles-computer = { workspace = true }
pegoles-policy = { workspace = true }
pegoles-core = { workspace = true }
pegoles-agent = { workspace = true }
pegoles-inference = { workspace = true }

# macOS only: in-process VM host + native framebuffer display. Never a
# dependency of the shared crates (they stay platform-free).
[target.'cfg(target_os = "macos")'.dependencies]
pegoles-macos-embed = { path = "../../../native/macos/pegoles-macos-embed" }
# Public AppKit only: the system accessibility display options (Reduce
# Transparency, Increase Contrast), which WKWebView does not expose to CSS,
# and the native alerts that confirm cloud settings (src/consent.rs), which
# script in the webview can neither read nor answer.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSAccessibility",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSError"] }
# WebKit content rule list for the main webview's network containment
# (src/webview_egress.rs); the same objc2-web-kit Tauri/wry already use.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "WKWebViewConfiguration",
] }
block2 = "0.6"
# Keychain storage for the model API key (never a file, never the webview).
security-framework = "3"

# Windows only: the native (system message box) confirmation of a task's
# internet access, which script in the webview can neither see nor answer.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = { workspace = true }
libc = { workspace = true }
# Mock runtime: the IPC tests run real requests through the app's ACL.
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
