ShortDescription: AI gets its own computer, not yours. A computer-use agent that works inside an isolated, offline virtual machine.
Description: |-
  Pegoles gives an AI model its own isolated Linux computer (a virtual
  machine with no network, no shared folders and no clipboard) and lets it
  operate that computer through typed actions checked by a deterministic
  policy. The default model runs on your PC; no account or API key is
  needed. Requires hardware virtualization and the Virtual Machine
  Platform feature, which Pegoles helps you turn on.
