# Pegoles guest hardening. Only root may ptrace (Yama mode 2): apps the
# agent drives cannot attach to the compositor or other same-user
# processes to tamper with them.
kernel.yama.ptrace_scope = 2
# No kernel pointer or dmesg leaks to unprivileged guest processes.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
